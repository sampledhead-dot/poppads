<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{font-family:"Chalkboard SE","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;font-weight:800;color:#fff;
 background:linear-gradient(160deg,var(--b1),var(--b2) 55%,var(--b3));transition:background .4s}
body[data-b="0"]{--b1:#3a0ca3;--b2:#7209b7;--b3:#f72585}
body[data-b="1"]{--b1:#03045e;--b2:#0077b6;--b3:#00d4b0}
button{font:inherit;color:inherit;cursor:pointer}
.fl{position:fixed;font-size:30px;opacity:.3;animation:fl 11s linear infinite;z-index:0;pointer-events:none}
@keyframes fl{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-12vh) rotate(360deg)}}
#app{position:relative;z-index:1;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:8px}
.logo{flex:1;font-size:26px;letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.logo b:nth-child(1){color:#ffd60a}.logo b:nth-child(2){color:#4cd964}.logo b:nth-child(3){color:#4cc9f0}.logo b:nth-child(4){color:#ff4d6d}.logo b:nth-child(5){color:#fff}.logo b:nth-child(6){color:#ffd60a}.logo b:nth-child(7){color:#4cd964}.logo b:nth-child(8){color:#4cc9f0}
.bk,.ed-toggle{height:44px;min-width:50px;padding:0 8px;border-radius:16px;border:3px solid rgba(255,255,255,.4);background:rgba(0,0,0,.25);font-size:22px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.bk.on{background:#fff;color:#3a0ca3;transform:scale(1.08);border-color:#fff}
body.edit .ed-toggle{background:#ffd60a;color:#333;border-color:#fff}
#pads{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:9px;padding:9px;border-radius:22px;background:linear-gradient(180deg,#2a2050,#171030);border:3px solid rgba(255,255,255,.3);box-shadow:inset 0 4px 12px rgba(0,0,0,.55),0 5px 0 rgba(0,0,0,.25)}
.pad{position:relative;border-radius:14px;background:linear-gradient(165deg,color-mix(in srgb,var(--c) 85%,#fff),var(--c) 45%,color-mix(in srgb,var(--c) 60%,#000));
 box-shadow:0 5px 0 color-mix(in srgb,var(--c) 35%,#000),0 8px 10px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.55);
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;touch-action:none;overflow:hidden;min-height:0;transition:transform .05s,box-shadow .05s}
.pad.dn{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 35%,#000),0 2px 4px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.3)}
.pad .num{position:absolute;left:7px;bottom:3px;font-size:11px;color:rgba(0,0,0,.45);font-weight:900}
.pad .led{position:absolute;right:6px;top:6px;width:9px;height:9px;border-radius:50%;background:#fff;opacity:.5;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.pad.hit .led{opacity:1;box-shadow:0 0 10px 4px #fff}
.pad .em{font-size:min(5.6vh,32px);line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.pad .mw{width:78%;height:26%;opacity:.92}
.pad .hint{font-size:15px;line-height:1}
.pad.has .hint{display:none}
.pad.empty{background:linear-gradient(165deg,#3a2f66,#231a45);border:2px dashed var(--c);box-shadow:0 5px 0 #120c2a,0 8px 10px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.12)}
.pad.empty .num{color:var(--c)}
.pad.empty .led{background:var(--c);opacity:.8}
.pad.empty .em{opacity:.3}
.pad.empty .mw{display:none}
.pad.hit{animation:pop .2s}
@keyframes pop{0%{transform:scale(.92) translateY(5px)}60%{transform:scale(1.06)}100%{transform:none}}
.pad.rec{background:#e11d48;border:4px solid #fff;animation:rec .45s infinite alternate}
@keyframes rec{to{transform:scale(1.04);box-shadow:0 0 30px 8px #ff2e63}}
.pe{display:none}
body.edit .pad.has{outline:4px dashed #fff;outline-offset:-6px;animation:wig .35s infinite alternate}
@keyframes wig{from{transform:rotate(-1.2deg)}to{transform:rotate(1.2deg)}}
#looper{background:rgba(0,0,0,.28);border-radius:26px;padding:8px;display:flex;flex-direction:column;gap:7px}
.tr{display:flex;gap:8px;align-items:center}
.big{width:50px;height:50px;border-radius:50%;border:4px solid #fff;font-size:24px;box-shadow:0 5px 0 rgba(0,0,0,.3);flex:none;padding:0}
#brec{background:#ff2e63}#bplay{background:#22c55e}
#brec.on{animation:rec .45s infinite alternate}
.bpm{flex:1;height:50px;border-radius:18px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;gap:6px}
.bpm.beat{animation:bt .18s}
@keyframes bt{from{background:rgba(255,255,255,.55)}to{background:rgba(255,255,255,.16)}}
.bpm button{width:34px;height:34px;border-radius:50%;border:0;background:#fff;color:#333;font-size:20px;padding:0}
.bpm .v{min-width:92px;text-align:center;font-size:22px;line-height:1}
.bpm small{display:block;font-size:11px;opacity:.85;font-weight:700}
.chips{display:flex;gap:6px}
.chip{flex:1;height:34px;border-radius:14px;border:3px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);font-size:14px;padding:0 4px}
.chip.on{background:#ffd60a;color:#333;border-color:#fff}
.chip.warn{background:#ff9f1c;color:#222}
.lane{display:flex;gap:5px;align-items:center;height:30px}
.lane.mute .lt{opacity:.35}
.lane button{height:30px;width:30px;border-radius:12px;border:3px solid rgba(255,255,255,.55);background:var(--t);color:#222;padding:0;font-size:15px;flex:none}
.lane .tsel.on{border-color:#fff;box-shadow:0 0 0 3px var(--t);transform:scale(1.08)}
.lane .tm,.lane .tx{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.3);width:32px}
.lt{position:relative;flex:1;height:100%;background:rgba(255,255,255,.14);border-radius:12px;overflow:hidden}
.tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.18)}.tick.s{background:rgba(255,255,255,.4)}
.dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.ph{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 8px #fff;display:none}
.playing .ph{display:block}
#ed{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;gap:10px;padding:12px calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) 12px;background:linear-gradient(160deg,#1b0b3a,#3a0ca3 60%,#f72585)}
#ed.on{display:flex}
.edh{display:flex;align-items:center;gap:10px;font-size:26px}
#edc{flex:1;min-height:40vh;width:100%;border-radius:26px;border:4px solid #fff;background:#0b0820;touch-action:none}
#edi{text-align:center;font-size:17px;opacity:.95}
.edb{display:flex;gap:8px}
.edb button{flex:1;height:64px;border-radius:20px;border:4px solid #fff;font-size:17px;line-height:1.1;box-shadow:0 5px 0 rgba(0,0,0,.3);padding:0 4px}
#edp{background:#22c55e}#edr{background:#4895ef}#edd{background:#ff4d6d}#edok{background:#ffd60a;color:#333}
#edd.warn{background:#ff9f1c;color:#222}
#start{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background:linear-gradient(160deg,#3a0ca3,#7209b7 55%,#f72585)}
#start .logo{font-size:52px;flex:none}
#start button{width:min(320px,90%);height:78px;border-radius:26px;border:5px solid #fff;font-size:22px;box-shadow:0 7px 0 rgba(0,0,0,.3)}
#s1{background:#22c55e}#s2{background:#ffd60a;color:#333}
#start p{margin:0;font-size:14px;opacity:.9;max-width:300px}
#toast{position:fixed;left:50%;bottom:calc(30% + 10px);transform:translateX(-50%) scale(.8);background:#fff;color:#3a0ca3;padding:12px 18px;border-radius:20px;font-size:16px;opacity:0;pointer-events:none;transition:.2s;z-index:60;text-align:center;max-width:90%}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
@media (max-height:600px){.big{width:48px;height:48px;font-size:20px}.bpm{height:48px}.chip{height:32px}.lane,.lane button{height:30px}.logo{font-size:22px}}
</style>
</head>

<span class="fl" style="left:8%;animation-delay:0s">⭐</span><span class="fl" style="left:30%;animation-delay:-4s">🎵</span><span class="fl" style="left:55%;animation-delay:-7s">✨</span><span class="fl" style="left:78%;animation-delay:-2s">🎶</span><span class="fl" style="left:92%;animation-delay:-9s">⭐</span>

 <header>
  <div class="logo"><b>P</b><b>o</b><b>p</b><b>!</b><b>P</b><b>a</b><b>d</b><b>s</b></div>

 </div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let ctx,master,micReady=false,recOn=false,recPad=-1,chunks=[],bank=0,editMode=false,lastBeat=-1;
const COL=['#ff4d6d','#ff9f1c','#ffd60a','#4cd964','#2ec4b6','#4895ef','#9b5de5','#f15bb5','#ff6b35','#f9c74f','#90be6a','#43aa8b','#00bbf9','#7b2cbf','#ef476f','#06d6a0'];
const EMO=['🐶','🐱','🐸','🦁','🐵','🐼','🐙','🦄','🚀','🌈','⭐','🍕','🎈','🐢','🦖','🍩'];
const EMO2=['🦊','🐰','🐷','🐮','🦆','🐞','🦋','🐳','🚗','🚒','🍎','🍦','🎸','🥁','🎺','🧸'];
const TC=['#ff4d6d','#ffd60a','#4cd964','#4cc9f0'];
const pads=Array.from({length:32},(_,i)=>({buf:null,s:0,e:1,c:COL[(i+(i>15?8:0))%16],em:i<16?EMO[i]:EMO2[i-16]}));
const LP={L:0,n:0,bpm:0,tr:[[],[],[],[]],mute:[0,0,0,0],sel:0,st:'idle',play:false,od:false,t0:0,tr0:0,sched:0,grid:4,magnet:true};

function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms||2300)}
function arm(btn,label,fn){if(btn._a){clearTimeout(btn._a);btn._a=0;btn.innerHTML=btn._o;btn.classList.remove('warn');fn();return}
 btn._o=btn.innerHTML;btn.innerHTML=label;btn.classList.add('warn');btn._a=setTimeout(()=>{btn._a=0;btn.innerHTML=btn._o;btn.classList.remove('warn')},2500)}

/* ---------- audio ---------- */
async function init(mic){
 ctx=new (window.AudioContext||window.webkitAudioContext)();
 const comp=ctx.createDynamicsCompressor();master=ctx.createGain();master.gain.value=.9;master.connect(comp);comp.connect(ctx.destination);
 await ctx.resume();
 if(mic){await getMic();if(!micReady)toast(micMsg(),6000)}
 $('#start').style.display='none';
 setInterval(tick,25);requestAnimationFrame(raf);renderBank();renderLanes();updateBtns();
}
const WEB=/^https?:$/.test(location.protocol);
let micErr='';
async function getMic(){
 if(micReady)return true;
 if(!WEB||!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){micErr='nomd';return false}
 try{
  const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const src=ctx.createMediaStreamSource(st),pr=ctx.createScriptProcessor(2048,1,1),z=ctx.createGain();z.gain.value=0;
  pr.onaudioprocess=e=>{if(recOn)chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)))};
  src.connect(pr);pr.connect(z);z.connect(ctx.destination);micReady=true;return true;
 }catch(err){micErr=err.name||'err';return false}
}
function micMsg(){
 if(micErr==='nomd')return 'El micrófono directo no funciona con un archivo abierto del móvil. Toca un pad vacío y grabo con la grabadora del móvil 🎙️';
 if(micErr==='NotAllowedError'||micErr==='SecurityError')return 'Permiso del micrófono denegado. Actívalo para esta página en los ajustes del navegador (el candado) y recarga 🔧';
 if(micErr==='NotFoundError')return 'No encuentro ningún micrófono 🎤';
 return 'No puedo usar el micrófono ('+micErr+')';
}
const fin=document.createElement('input');fin.type='file';fin.accept='audio/*';fin.style.display='none';document.body.appendChild(fin);let fpad=-1;
fin.onchange=async()=>{const f=fin.files[0],i=fpad;fin.value='';if(!f||i<0)return;
 try{const b=await ctx.decodeAudioData(await f.arrayBuffer());const p=pads[i];p.buf=b;p.s=0;p.e=1;renderBank();flash(i);playPad(i)}catch(e){toast('No pude leer ese audio 😢')}};
function playPad(i,when,vel){
 const p=pads[i];if(!p.buf)return;const w=Math.max(when||0,ctx.currentTime),d=p.buf.duration,len=Math.max(.02,(p.e-p.s)*d);
 const s=ctx.createBufferSource();s.buffer=p.buf;const g=ctx.createGain();g.gain.setValueAtTime(vel||1,w);
 g.gain.setValueAtTime(vel||1,w+len-.012);g.gain.linearRampToValueAtTime(0,w+len);
 s.connect(g);g.connect(master);s.start(w,p.s*d,len);
}
function mkBuf(dur,fn){const sr=ctx.sampleRate,n=sr*dur|0,b=ctx.createBuffer(1,n,sr),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=fn(i/sr,i);return b}
function fillDemo(){
 const sr=ctx.sampleRate,TAU=Math.PI*2;let ph=0,p2=0,lp=0;
 const nz=()=>Math.random()*2-1;
 pads[0].buf=mkBuf(.4,t=>{ph+=TAU*(45+130*Math.exp(-t*28))/sr;return Math.sin(ph)*Math.exp(-t*7)*.95});
 pads[1].buf=mkBuf(.28,t=>(nz()*Math.exp(-t*16)*.6+Math.sin(TAU*190*t)*Math.exp(-t*24)*.5));
 let pv=0;pads[2].buf=mkBuf(.1,t=>{const x=nz();const y=x-pv;pv=x;return y*Math.exp(-t*55)*.8});
 pv=0;pads[3].buf=mkBuf(.4,t=>{const x=nz();const y=x-pv;pv=x;return y*Math.exp(-t*9)*.7});
 pads[4].buf=mkBuf(.3,t=>{const e=Math.exp(-((t*1000)%11)*.45)*(t<.03?1:0)+Math.exp(-(t-.033)*28)*(t>=.033?1:0);return nz()*e*.7});
 ph=0;pads[5].buf=mkBuf(.45,t=>{ph+=TAU*(110+110*Math.exp(-t*18))/sr;return Math.sin(ph)*Math.exp(-t*8)*.9});
 pads[6].buf=mkBuf(.3,t=>{const f=660;return Math.sin(TAU*f*t+3*Math.sin(TAU*f*2*t))*Math.exp(-t*9)*.55});
 ph=0;pads[7].buf=mkBuf(.35,t=>{ph+=TAU*(1300*Math.exp(-t*8)+180)/sr;return ((ph/TAU)%1*2-1)*Math.exp(-t*7)*.5});
 renderBank();toast('¡Listo! Toca los pads 🥁');
}

/* ---------- pads ---------- */
const padsEl=$('#pads'),els=[];
for(let r=3;r>=0;r--)for(let c=0;c<4;c++){
 const s=r*4+c,d=document.createElement('div');d.className='pad empty';
 d.innerHTML='<i class="led"></i><div class="em"></div><canvas class="mw" width="120" height="36"></canvas><div class="hint"></div><span class="num">'+(s+1)+'</span>';
 padsEl.appendChild(d);els[s]=d;
 d.addEventListener('pointerdown',e=>{e.preventDefault();try{d.setPointerCapture(e.pointerId)}catch(_){}d.classList.add('dn');down(bank*16+s,d)});
 const up=()=>{d.classList.remove('dn');release()};d.addEventListener('pointerup',up);d.addEventListener('pointercancel',up);
 d.addEventListener('contextmenu',e=>e.preventDefault());
}
function renderBank(){
 els.forEach((d,s)=>{const i=bank*16+s,p=pads[i],has=!!p.buf;
  d.style.setProperty('--c',p.c);d.classList.toggle('empty',!has);d.classList.toggle('has',has);d.classList.remove('rec');
  d.querySelector('.em').textContent=p.em;d.querySelector('.hint').innerHTML='🎤';
  if(has)drawMini(d.querySelector('.mw'),p);
 });
}
function drawMini(c,p){
 const g=c.getContext('2d'),W=c.width,H=c.height,data=p.buf.getChannelData(0),bs=data.length/W,st=Math.max(1,Math.floor(bs/40));
 g.clearRect(0,0,W,H);g.fillStyle='rgba(255,255,255,.92)';
 for(let x=0;x<W;x+=3){let m=0;const a=Math.floor(x*bs),b=Math.min(data.length,Math.floor((x+3)*bs));for(let j=a;j<b;j+=st){const v=Math.abs(data[j]);if(v>m)m=v}
  const h=Math.max(2,m*H);g.fillRect(x,(H-h)/2,2,h)}
}
function flash(i){if((i>>4)!==bank)return;const d=els[i&15];d.classList.remove('hit');void d.offsetWidth;d.classList.add('hit')}
function down(i,d){
 if(!ctx)return;ctx.resume();const p=pads[i];
 if(p.buf){if(editMode){openEd(i);return}hit(i)}
 else{if(editMode){toast('Este pad está vacío 🙂');return}startRec(i,d)}
}
function hit(i){
 playPad(i);flash(i);
 if(LP.st==='armed'||LP.st==='rec1'||(LP.play&&LP.od))addEvent(i);
}
function startRec(i,d){
 if(!micReady){
  if(!WEB||!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){micErr='nomd';fpad=i;toast('Grabo con la app del móvil: elige «Grabar audio» 🎙️',4500);fin.click();return}
  getMic().then(ok=>toast(ok?'¡Micrófono listo! Ahora mantén pulsado un pad 🎤':micMsg(),ok?2500:6000));return;
 }
 chunks=[];recOn=true;recPad=i;d.classList.add('rec');d.querySelector('.hint').innerHTML='🔴';
}
function release(){
 if(recPad<0)return;recOn=false;const i=recPad;recPad=-1;
 let n=0;chunks.forEach(c=>n+=c.length);
 if(n<ctx.sampleRate*.15){toast('¡Muy corto! Mantén más tiempo ⏱️');chunks=[];renderBank();return}
 const b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);let o=0,pk=0;
 chunks.forEach(c=>{d.set(c,o);o+=c.length});chunks=[];
 for(let k=0;k<n;k++){const v=Math.abs(d[k]);if(v>pk)pk=v}
 const gn=pk>.001?.9/pk:1,f=Math.min(n>>1,Math.floor(ctx.sampleRate*.006));
 for(let k=0;k<n;k++){d[k]*=gn;if(k<f)d[k]*=k/f;if(n-k<f)d[k]*=(n-k)/f}
 const p=pads[i];p.buf=b;p.s=0;p.e=1;renderBank();flash(i);playPad(i);
}

/* ---------- looper ---------- */
function addEvent(i){
 const now=ctx.currentTime;let t,skip=-1;
 if(LP.st==='armed'){LP.st='rec1';LP.tr0=now;t=0;updateBtns()}
 else if(LP.st==='rec1'){t=now-LP.tr0}
 else{
  t=(((now-LP.t0)%LP.L)+LP.L)%LP.L;skip=Math.floor((now-LP.t0)/LP.L);
  if(LP.magnet){const step=LP.L/(LP.n*LP.grid);t=(Math.round(t/step)*step)%LP.L}
 }
 const tr=LP.tr[LP.sel];
 if(!tr.some(e=>e.pad===i&&Math.abs(e.t-t)<.002))tr.push({t,pad:i,skip});
 renderLanes();
}
function tick(){
 if(!LP.play)return;const now=ctx.currentTime,hz=now+.12,L=LP.L;
 if(LP.sched<now-.2)LP.sched=now;
 const k0=Math.floor((LP.sched-LP.t0)/L),k1=Math.floor((hz-LP.t0)/L);
 for(let k=k0;k<=k1;k++)for(let tk=0;tk<4;tk++){if(LP.mute[tk])continue;
  for(const e of LP.tr[tk]){const a=LP.t0+k*L+e.t;
   if(a>=LP.sched&&a<hz&&e.skip!==k){playPad(e.pad,a);setTimeout(()=>flash(e.pad),Math.max(0,(a-now)*1000))}}}
 LP.sched=hz;
}
function closeLoop(){
 const now=ctx.currentTime;let L=Math.max(now-LP.tr0,.6),best=null;
 for(const n of [2,4,8,16]){const b=n*60/L,sc=Math.abs(Math.log2(b/100));if(!best||sc<best.sc)best={n,b,sc}}
 const bpm=Math.round(best.b),L2=best.n*60/bpm,f=L2/L;
 LP.tr.forEach(t=>t.forEach(e=>{e.t=Math.min(e.t*f,L2-.001)}));
 LP.L=L2;LP.n=best.n;LP.bpm=bpm;LP.st='play';LP.od=false;startPlay();
 if(LP.magnet)quant();
 renderLanes();updateBtns();toast('¡Tempo ≈ '+bpm+' BPM! 🎉 Pulsa ⏺ para añadir más');
}
function startPlay(){LP.play=true;LP.t0=ctx.currentTime;LP.sched=LP.t0}
function quant(){
 if(!LP.L)return;const step=LP.L/(LP.n*LP.grid);
 for(let ti=0;ti<4;ti++){const seen=new Set();
  LP.tr[ti]=LP.tr[ti].map(e=>({...e,t:(Math.round(e.t/step)*step)%LP.L})).filter(e=>{const k=e.pad+'_'+Math.round(e.t*1000);if(seen.has(k))return false;seen.add(k);return true})}
 renderLanes();
}
function setBpm(b){
 if(!LP.L)return;b=Math.max(50,Math.min(200,b));if(b===LP.bpm)return;
 const nL=LP.n*60/b,f=nL/LP.L,now=ctx.currentTime;
 LP.tr.forEach(t=>t.forEach(e=>{e.t*=f}));
 if(LP.play){const fr=(((now-LP.t0)%LP.L)+LP.L)%LP.L/LP.L;LP.t0=now-fr*nL;LP.sched=now}
 LP.L=nL;LP.bpm=b;updateBtns();
}
function onRec(){
 if(!ctx)return;ctx.resume();
 if(!LP.L){
  if(LP.st==='idle'){LP.st='armed';toast('Toca un pad para empezar 🥁')}
  else if(LP.st==='armed')LP.st='idle';
  else if(LP.st==='rec1')closeLoop();
 }else{if(!LP.play)startPlay();LP.od=!LP.od}
 updateBtns();
}
function onPlay(){
 if(!ctx)return;ctx.resume();
 if(LP.st==='rec1'){closeLoop();return}
 if(!LP.L){toast('Primero graba un ritmo ⏺');return}
 if(LP.play){LP.play=false;LP.od=false}else startPlay();
 updateBtns();
}
function clearAll(){LP.tr=[[],[],[],[]];LP.L=0;LP.n=0;LP.bpm=0;LP.st='idle';LP.play=false;LP.od=false;renderLanes();updateBtns()}
function updateBtns(){
 $('#brec').classList.toggle('on',LP.st==='armed'||LP.st==='rec1'||LP.od);
 $('#bplay').textContent=(LP.play||LP.st==='rec1')?'⏹':'▶';
 $('#lanes').classList.toggle('playing',LP.play);
 $$('.lane').forEach((l,i)=>{l.classList.toggle('mute',!!LP.mute[i]);l.querySelector('.tsel').classList.toggle('on',LP.sel===i);l.querySelector('.tm').textContent=LP.mute[i]?'🔇':'🔊'});
 let v='Graba un ritmo';
 if(LP.st==='armed')v='Toca un pad…';else if(LP.st==='rec1')v='Grabando…';else if(LP.L)v='<small>tempo ≈</small>'+LP.bpm;
 $('#bv').innerHTML=v;$('#bgrid').textContent=LP.grid===4?'1/16':'1/8';
}
const lanesEl=$('#lanes');
for(let i=0;i<4;i++){
 const l=document.createElement('div');l.className='lane';l.style.setProperty('--t',TC[i]);
 l.innerHTML='<button class="tsel">'+(i+1)+'</button><div class="lt"></div><button class="tm">🔊</button><button class="tx">✕</button>';
 lanesEl.appendChild(l);
 l.querySelector('.tsel').onclick=()=>{LP.sel=i;updateBtns()};
 l.querySelector('.tm').onclick=()=>{LP.mute[i]^=1;updateBtns()};
 l.querySelector('.tx').onclick=()=>{LP.tr[i]=[];if(LP.tr.every(t=>!t.length)&&LP.st!=='rec1')clearAll();else renderLanes()};
}
function renderLanes(){
 $$('.lt').forEach((lt,ti)=>{let h='';
  if(LP.n)for(let b=0;b<LP.n;b++)h+='<i class="tick '+(b%4===0?'s':'')+'" style="left:'+(b/LP.n*100)+'%"></i>';
  if(LP.L)for(const e of LP.tr[ti])h+='<b class="dot" style="left:'+(e.t/LP.L*100)+'%;--c:'+pads[e.pad].c+'"></b>';
  lt.innerHTML=h+'<i class="ph"></i>'});
}
function raf(){
 if(LP.play&&LP.L){
  const pos=(((ctx.currentTime-LP.t0)%LP.L)+LP.L)%LP.L/LP.L;
  $$('.ph').forEach(p=>p.style.left=(pos*100)+'%');
  const b=Math.floor(pos*LP.n);if(b!==lastBeat){lastBeat=b;const e=$('#bpm');e.classList.remove('beat');void e.offsetWidth;e.classList.add('beat')}
 }
 if(LP.st==='rec1')$('#bv').innerHTML='<small>grabando</small>'+(ctx.currentTime-LP.tr0).toFixed(1)+' s';
 if(ed&&ed.pl){const p=pads[ed.i],d=p.buf.duration,f=p.s+(ctx.currentTime-ed.pl.t0)/d;if(f>p.e){ed.pl=null;drawEd()}else drawEd(f)}
 requestAnimationFrame(raf);
}

/* ---------- editor grande ---------- */
let ed=null;
function openEd(i){
 ed={i,pk:null,pl:null,drag:null};$('#ed').classList.add('on');
 $('#edt').textContent=pads[i].em+' Pad '+(i+1);sizeEd();drawEd();info();
}
function sizeEd(){
 const c=$('#edc'),r=c.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);
 c.width=Math.max(50,Math.round(r.width*d));c.height=Math.max(50,Math.round(r.height*d));ed.d=d;
 const data=pads[ed.i].buf.getChannelData(0),W=c.width,pk=new Float32Array(W*2),bs=data.length/W;
 for(let x=0;x<W;x++){let mn=1,mx=-1;const a=Math.floor(x*bs),b=Math.min(data.length,Math.floor((x+1)*bs)+1);
  for(let j=a;j<b;j++){const v=data[j];if(v<mn)mn=v;if(v>mx)mx=v}pk[2*x]=mn;pk[2*x+1]=mx}
 ed.pk=pk;
}
function drawEd(ph){
 if(!ed)return;const c=$('#edc'),g=c.getContext('2d'),W=c.width,H=c.height,p=pads[ed.i],d=ed.d,sx=p.s*W,ex=p.e*W;
 g.clearRect(0,0,W,H);
 for(let x=0;x<W;x++){const mn=ed.pk[2*x],mx=ed.pk[2*x+1],y1=H/2-mx*H*.46,y2=H/2-mn*H*.46;
  g.fillStyle=(x>=sx&&x<=ex)?p.c:'rgba(255,255,255,.2)';g.fillRect(x,y1,1.4,Math.max(1.5,y2-y1))}
 g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,0,sx,H);g.fillRect(ex,0,W-ex,H);
 const knob=(x,y,col,t)=>{g.fillStyle=col;g.fillRect(x-3*d,0,6*d,H);g.beginPath();g.arc(x,y,24*d,0,7);g.fill();g.lineWidth=4*d;g.strokeStyle='#fff';g.stroke();
  g.fillStyle='#fff';g.font='bold '+(22*d)+'px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(t,x,y+1*d)};
 knob(sx,H*.2,'#4cd964','▶');knob(ex,H*.8,'#ff4d6d','■');
 if(ph!=null){const x=ph*W;g.fillStyle='#fff';g.fillRect(x-2*d,0,4*d,H)}
}
function info(){const p=pads[ed.i],d=p.buf.duration;$('#edi').textContent='Inicio '+(p.s*d).toFixed(2)+' s  ·  Fin '+(p.e*d).toFixed(2)+' s  ·  Dura '+((p.e-p.s)*d).toFixed(2)+' s'}
(function(){
 const c=$('#edc');
 const mv=e=>{const r=c.getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),p=pads[ed.i];
  if(ed.drag==='s')p.s=Math.min(x,p.e-.02);else p.e=Math.max(x,p.s+.02);ed.pl=null;drawEd();info()};
 c.addEventListener('pointerdown',e=>{if(!ed)return;e.preventDefault();c.setPointerCapture(e.pointerId);
  const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height,p=pads[ed.i],ds=Math.abs(x-p.s),de=Math.abs(x-p.e);
  ed.drag=Math.abs(ds-de)<.04?(y<.5?'s':'e'):(ds<de?'s':'e');mv(e)});
 c.addEventListener('pointermove',e=>{if(ed&&ed.drag)mv(e)});
 const up=()=>{if(ed)ed.drag=null};c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
})();
function closeEd(){ed=null;$('#ed').classList.remove('on');renderBank()}
$('#edp').onclick=()=>{const p=pads[ed.i];playPad(ed.i);ed.pl={t0:ctx.currentTime}};
$('#edr').onclick=()=>{const p=pads[ed.i];p.s=0;p.e=1;drawEd();info()};
$('#edd').onclick=function(){arm(this,'¿Seguro?<br>🗑️ Sí',()=>{const i=ed.i;pads[i].buf=null;pads[i].s=0;pads[i].e=1;
 LP.tr.forEach((t,k)=>LP.tr[k]=t.filter(e=>e.pad!==i));closeEd();renderLanes();toast('Pad vacío otra vez ✨')})};
$('#edok').onclick=closeEd;
addEventListener('resize',()=>{if(ed){sizeEd();drawEd()}});

/* ---------- botones ---------- */
$$('.bk').forEach(b=>b.onclick=()=>{bank=+b.dataset.b;document.body.dataset.b=bank;$$('.bk').forEach(x=>x.classList.toggle('on',x===b));renderBank()});
$('#etog').onclick=()=>{editMode=!editMode;document.body.classList.toggle('edit',editMode);toast(editMode?'Toca un pad para editarlo ✏️':'Modo tocar 🎵')};
$('#brec').onclick=onRec;$('#bplay').onclick=onPlay;
$('#bm').onclick=()=>setBpm(LP.bpm-1);$('#bp').onclick=()=>setBpm(LP.bpm+1);
$('#bq').onclick=()=>{if(!LP.L){toast('Primero graba un ritmo ⏺');return}quant();toast('¡Todo al ritmo! ✨')};
$('#bmag').onclick=function(){LP.magnet=!LP.magnet;this.classList.toggle('on',LP.magnet)};
$('#bgrid').onclick=()=>{LP.grid=LP.grid===4?2:4;updateBtns()};
$('#bclr').onclick=function(){arm(this,'¿Seguro?',clearAll)};
$('#s1').onclick=()=>init(true);
$('#s2').onclick=async()=>{await init(false);fillDemo()};
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
